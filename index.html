<style>
:root{--y:#FFD21F;--ink:#111;--paper:#FFFDF5;--green:#5EE17B;--ly:#FFE680;--lav:#B8A8FF;--pk:#FF8FB0;--pink:#FF5C89;--vio:#7C5CFF}
*{box-sizing:border-box;font-family:'Space Grotesk',system-ui,sans-serif}
html,body{margin:0;height:100%}
#app{position:fixed;inset:0;z-index:999999;background:var(--y);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:14px;font-weight:500}
#app::before{content:'';position:fixed;left:-110px;top:120px;width:210px;height:210px;border-radius:50%;background:var(--pink);z-index:0}
#app::after{content:'';position:fixed;right:-130px;top:520px;width:270px;height:270px;border-radius:50%;background:var(--vio);z-index:0}
#shell{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto}
#side{display:none!important}
#col{flex:1;display:flex;flex-direction:column;overflow:hidden;width:100%}
#hdr{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.hb{width:44px;height:44px;flex:0 0 auto;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0;color:var(--ink)}
.hb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hb.gr{background:#30BF4D}.hb.pk{background:var(--pink)}.hb.s{width:42px;height:42px;border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
.hb i{position:absolute;top:-10px;right:-10px;min-width:22px;height:22px;border:2.5px solid var(--ink);border-radius:99px;background:var(--pink);font:700 11px/17px 'Space Grotesk',sans-serif;text-align:center;font-style:normal;padding:0 4px}
.ht{flex:1;min-width:0}.ht h2{margin:0;font-size:19px;line-height:1.1;font-weight:700}.ht span{white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;margin-top:3px}
#main{flex:1;overflow:auto;padding:10px 16px 120px}
#bot{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:740px;padding:6px;justify-content:space-around;gap:2px;z-index:5;border-radius:24px}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;border-radius:16px;background:none;padding:6px 2px;font:700 10px 'Space Grotesk',sans-serif;color:var(--ink);cursor:pointer;flex:1;min-width:0}
.nb.on{background:var(--y);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.g{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}
.p{padding:18px;margin-bottom:16px}.p h3{margin:0 0 4px;font-size:22px;font-weight:700}
.mut{color:#444;font-weight:500;font-size:13px}
.ph{font-size:34px;font-weight:700;margin:4px 0 14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.card{padding:14px;display:flex;gap:10px;align-items:center}
.cards>.card:nth-child(4n+1),.cards>.sc:nth-child(1){background:var(--green)}.cards>.card:nth-child(4n+2),.cards>.sc:nth-child(2){background:var(--ly)}
.cards>.card:nth-child(4n+3),.cards>.sc:nth-child(3){background:var(--lav)}.cards>.card:nth-child(4n+4),.cards>.sc:nth-child(4){background:var(--pk)}
.cards>.sc:nth-child(5){background:#fff;grid-column:1/-1}
.card .ib{width:52px;height:52px;flex:0 0 auto;background:#fff;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center}
.card small,.sc small{display:block;font-weight:700;font-size:13px;line-height:1.15}.card b{display:block;font-size:30px;line-height:1.1;font-weight:700;word-break:break-word}
.sc{padding:14px 16px}.sc b{display:block;font-size:30px;margin-top:6px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;margin-top:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 12px;border:2.5px solid var(--ink);border-radius:99px;font-size:12px;font-weight:700;background:var(--y);color:var(--ink)}
.pill.g1{background:var(--green)}.pill.r{background:var(--pink)}.pill.y{background:var(--ly)}.pill.wh{background:#fff}
button.pill{cursor:pointer;font-family:inherit;padding:6px 14px}
.btn{border:3px solid var(--ink);border-radius:16px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);background:var(--y);box-shadow:3px 3px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ok{background:var(--green)}.btn.no{background:var(--pink)}.btn.w{background:#fff}.btn.sm{padding:6px 10px;font-size:12px;border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
.in{width:100%;padding:12px 14px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:600;font-size:15px;color:var(--ink);font-family:inherit}
.in:focus{outline:none;box-shadow:3px 3px 0 var(--ink)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;text-transform:uppercase;font-weight:700;padding:8px;border-bottom:3.5px solid var(--ink)}td{padding:9px 8px;border-top:2px solid rgba(17,17,17,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.avc{width:50px;height:50px;border:3px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.f>div{flex:1;min-width:130px}
.dot{display:inline-block;width:18px;height:18px;border:2.5px solid var(--ink);border-radius:50%;vertical-align:-3px;margin-right:6px}
#md{display:none;position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:10;align-items:center;justify-content:center;padding:14px}
#md>div{max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:20px}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;z-index:20;max-width:88vw;text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
#prev{position:relative;z-index:50;background:#fff;border-bottom:3px solid var(--ink);padding:6px 12px;font-weight:700;font-size:12px;display:none;flex-wrap:wrap;gap:6px;align-items:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;padding:5px;border-radius:18px;border:3px solid var(--ink)}
.tabs button{border:3px solid transparent;padding:11px;border-radius:13px;font-weight:700;font-size:14px;background:none;cursor:pointer;color:var(--ink);font-family:inherit}
.tabs .on{background:var(--y);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
#login{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:22px;overflow-y:auto;padding:calc(48px + env(safe-area-inset-top,0px)) 20px calc(34px + env(safe-area-inset-bottom,0px))}
#login .lg{width:min(250px,66vw);aspect-ratio:240/281;border:3px solid var(--ink);border-radius:24px;overflow:hidden;background:#fff;box-shadow:7px 7px 0 var(--ink);flex:0 0 auto;margin:auto 0}
#login .lg img{width:100%;height:100%;display:block;object-fit:cover}
#login .lc{width:100%;max-width:420px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:6px 6px 0 var(--ink);margin:auto 0 0}
#login .lc .sub{font-size:15px;font-weight:600;margin:0 0 12px}
#login .lb{width:100%;margin-top:18px;padding:15px;border:3px solid var(--ink);border-radius:16px;background:var(--green);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);font-family:inherit}
#login .lb:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
#ovl{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;text-align:center;color:var(--ink);padding:20px;cursor:pointer}
#ovl.in{background:var(--green)}#ovl.out{background:var(--lav)}#ovl.err{background:var(--pink)}#ovl.star{background:var(--y)}
#ovl .oi{font-size:110px;line-height:1;animation:pop .5s}#ovl .ot{font-size:32px;font-weight:700;margin-top:8px}#ovl .os{font-size:24px;font-weight:700;margin-top:6px}
#ovl .oc{font-size:20px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 18px;margin-top:16px;line-height:1.7;box-shadow:5px 5px 0 var(--ink)}#ovl .od{margin-top:18px;font-size:12px;font-weight:600}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style></head>

(()=>{

const dur=m=>Math.floor(m/60)+'j '+(m%60)+'m';

const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const IP={clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',sparkle:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',bar:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="3" y1="20" x2="21" y2="20"/>',camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>','plus-square':'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',trend:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>',pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',check:'<polyline points="20 6 9 17 4 12"/>',checkc:'<circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>',alarm:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'};
const ic=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto">${IP[n]||''}</svg>`;
const stI=(n,z=22)=>{let h='';for(let i=0;i<5;i++)h+=`<svg width="${z}" height="${z}" viewBox="0 0 24 24" stroke="#111" stroke-width="2" stroke-linejoin="round" fill="${i<n?'#FFD21F':'none'}"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;return h};
const EM2I={'👥':'users','✅':'checkc','⏰':'alarm','🏥':'plus-square','👤':'user','🗓️':'calendar','⏱️':'clock'};
const DEF={shift1_in:'07:00',shift1_out:'15:00',shift2_in:'15:00',shift2_out:'23:00',toleransi_menit:15,target_jam:8,radius_gps:100,office_lat:null,office_lng:null};
let db=null;if(!P){try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){console.error(e)}}
const S={role:null,me:null,view:'dash',tm:ymd(new Date()).slice(0,7),tl:[],nc:null,anns:[],ann:null,annSeen:null,emps:[],logs:[],leaves:[],cfg:{...DEF},f:{s:ymd(new Date(new Date().getFullYear(),new Date().getMonth(),1)),e:ymd(new Date()),emp:'ALL'}};

// ===== PREVIEW: data minimalis di memori =====
const M={karyawan:[{id:'p1',nik:'EMP-001',nama:'Bella Putri',pin_password:'123456',shift_default:'SHIFT_1',avatar_style:'wanita',tanggal_bergabung:ymd(new Date()),jadwal_minggu:['SHIFT_1','SHIFT_1','SHIFT_1','SHIFT_1','SHIFT_1','LIBUR','LIBUR']},{id:'p2',nik:'EMP-002',nama:'Rizky Pratama',pin_password:'123456',shift_default:'SHIFT_2',avatar_style:'pria',tanggal_bergabung:ymd(new Date()),jadwal_minggu:['SHIFT_2','SHIFT_2','SHIFT_2','SHIFT_2','SHIFT_2','LIBUR','LIBUR']}],
absensi:[{id:'pa1',karyawan_id:'p1',nama_karyawan:'Bella Putri',tanggal:ymd(new Date()),shift_kode:'SHIFT_1',waktu_masuk:'06:58',waktu_pulang:'15:02',durasi_menit:484,menit_terlambat:0,status_kehadiran:'Tepat Waktu',status_lokasi:'Terminal Admin'}],
izin:[{id:'pi1',karyawan_id:'p2',nama_karyawan:'Rizky Pratama',jenis_izin:'Sakit',tanggal_mulai:ymd(new Date()),tanggal_selesai:ymd(new Date()),jumlah_hari:1,alasan:'Demam',info_lampiran:'-',status_approval:'Menunggu'}],pengaturan_shift:[]};

M.pengumuman=[];
// ===== LAPISAN DATABASE (Supabase asli / memori saat preview) =====
const D={
async list(t,c,v){if(P)return M[t].filter(r=>!c||r[c]===v).map(r=>({...r}));return D.all(()=>{let x=db.from(t).select('*');if(c)x=x.eq(c,v);return x})},
async all(mk){let o=[],f=0;for(;;){const r=await mk().order('id').range(f,f+999);if(r.error)throw r.error;o=o.concat(r.data);if(r.data.length<1000)return o;f+=1000}},
async sel(t,cols,a,b){if(P)return M[t].filter(r=>r.tanggal>=a&&r.tanggal<=b);return D.all(()=>db.from(t).select(cols).gte('tanggal',a).lte('tanggal',b))},
async ins(t,row){if(P){row={id:'p'+Math.random().toString(36).slice(2),...row};M[t].push(row);return row}const r=await db.from(t).insert(row).select().single();if(r.error)throw r.error;return r.data},
async upd(t,id,p){if(P){Object.assign(M[t].find(x=>x.id===id),p);return}const r=await db.from(t).update(p).eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error('Ditolak oleh RLS / data tidak ditemukan')},
async del(t,id){if(P){M[t]=M[t].filter(x=>x.id!==id);return}const r=await db.from(t).delete().eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error('Ditolak oleh RLS / data tidak ditemukan')},
async saveCfg(c){if(P)return;const r=await db.from('pengaturan_shift').upsert({id:1,...c});if(r.error)throw r.error},
async purge(cut){for(const[t,c]of[['absensi','tanggal'],['izin','tanggal_mulai']]){if(P){M[t]=cut?M[t].filter(r=>r[c]>=cut):[];continue}let x=db.from(t).delete();x=cut?x.lt(c,cut):x.not('id','is',null);const r=await x;if(r.error)throw r.error}}
};

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',3400)}
const err=e=>{console.error(e);toast('⚠️ '+(e.message||e))};
const emp=id=>S.emps.find(e=>e.id===id);
const isA=()=>S.role==='ADMIN';
const shLbl=c=>c==='SHIFT_1'?`Shift 1 (${S.cfg.shift1_in}-${S.cfg.shift1_out})`:c==='SHIFT_2'?`Shift 2 (${S.cfg.shift2_in}-${S.cfg.shift2_out})`:c==='IZIN'?'Izin/Sakit':'Libur';
const todayIdx=()=>(new Date().getDay()+6)%7;
const stPill=s=>`<span class="pill ${s==='Tepat Waktu'?'g1':s==='Terlambat'?'y':'r'}">${esc(s)}</span>`;

async function loadData(){
 const st=S.role==='STAFF',[e,l,v,c,an]=await Promise.all([st?D.list('karyawan','id',S.me):D.list('karyawan'),st?D.list('absensi','karyawan_id',S.me):D.list('absensi'),st?D.list('izin','karyawan_id',S.me):D.list('izin'),D.list('pengaturan_shift'),D.list('pengumuman').catch(()=>[])]);
 S.emps=e.sort((a,b)=>(a.nik||'').localeCompare(b.nik||''));
 S.logs=l.sort((a,b)=>(b.tanggal+(b.waktu_masuk||'')).localeCompare(a.tanggal+(a.waktu_masuk||'')));
 S.leaves=v.sort((a,b)=>(b.tanggal_mulai||'').localeCompare(a.tanggal_mulai||''));
 S.cfg={...DEF,...(c[0]||{})};S.anns=an||[];S.ann=S.anns.slice().sort((a,b)=>b.bulan.localeCompare(a.bulan))[0]||null;
}

async function faceGrab(maxMs=25000){const v=$('cam');if(!v)return null;const o=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.4});let okN=0,miss=0;const t0=Date.now();
 while(Date.now()-t0<maxMs){if(!$('cam')||!FA.stream)return null;
  const d=await faceapi.detectSingleFace(v,o);
  if(!d){okN=0;miss++;guide(false,miss>8?'Wajah belum terlihat • cari tempat lebih terang':'Arahkan wajah ke dalam kotak');await sleep(120);continue}
  miss=0;const b=d.box,vw=v.videoWidth,vh=v.videoHeight,n=Math.min(vw,vh),dx=1-((b.x+b.width/2)-(vw-n)/2)/n,dy=((b.y+b.height/2)-(vh-n)/2)/n,sz=b.width/n;
  const m=sz<.32?'Dekatkan wajah':sz>.62?'Mundur sedikit':dx<.37?'Geser wajah ke kanan':dx>.63?'Geser wajah ke kiri':dy<.35?'Turunkan wajah sedikit':dy>.65?'Naikkan wajah sedikit':null;
  if(m){okN=0;guide(false,m);await sleep(120);continue}

const fdist=(a,b)=>Math.sqrt(a.reduce((q,x,i)=>q+(x-b[i])**2,0));
const geo=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Browser tidak mendukung GPS'));navigator.geolocation.getCurrentPosition(p=>ok(p.coords),e=>no(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan lokasi untuk situs ini.':'Gagal membaca lokasi, coba di area terbuka')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))};

rep(){if($('rf-s')){S.f.s=$('rf-s').value;S.f.e=$('rf-e').value;S.f.emp=isA()?$('rf-m').value:S.me}
 const R=repRows(),H=R.filter(l=>l.shift_kode!=='IZIN'),tot=H.reduce((a,l)=>a+(l.durasi_menit||0),0),late=H.reduce((a,l)=>a+(l.menit_terlambat||0),0),J=H.filter(l=>l.jarak_meter!=null);
 const c=(l,v)=>`<div class="g sc"><small>${l}</small><b>${v}</b></div>`;
 $('rb').innerHTML=`<div class="cards">${c('Total Hadir',H.length+' hari')+c('Total Jam Kerja',dur(tot))+c('Rata-rata/Hari',H.length?dur(Math.round(tot/H.length)):'0j 0m')+c('Total Terlambat',late+' mnt')+c('Rata-rata Jarak',J.length?Math.round(J.reduce((a,l)=>a+l.jarak_meter,0)/J.length)+' m':'-')}</div>
 <div class="g p tw"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Shift</th><th>Masuk - Pulang</th><th>Durasi</th><th>Status</th><th>Jarak</th><th>Lokasi</th><th>Foto</th></tr></thead><tbody>${R.map(l=>`<tr><td>${esc(l.tanggal)}</td><td><b>${esc(l.nama_karyawan)}</b></td><td>${esc(l.shift_kode)}</td><td>${esc(l.waktu_masuk)} - ${esc(l.waktu_pulang)}</td><td>${dur(l.durasi_menit||0)}</td><td>${stPill(l.status_kehadiran)}</td><td>${l.jarak_meter!=null?'<b>📍 '+l.jarak_meter+' m</b>':'-'}</td><td>${esc(l.status_lokasi||'-')}${l.skor_wajah!=null?'<div class="mut">🙂 wajah '+l.skor_wajah+'%</div>':''}${mapA(l)}</td><td><div style="display:flex;gap:6px">${thumb(l.foto_masuk)||'-'}${thumb(l.foto_pulang)}</div></td></tr>`).join('')||`<tr><td colspan="9">${empty('Tidak ada data pada rentang ini.')}</td></tr>`}</tbody></table></div>`},
async star(){if(!isA()){try{const[y,m]=S.tm.split('-').map(Number),last=new Date(y,m,0).getDate();S.tl=await D.sel('absensi','karyawan_id,nama_karyawan,tanggal,shift_kode,menit_terlambat,durasi_menit',S.tm+'-01',S.tm+'-'+pad(last))}catch(e){err(e)}}const b=$('sb');if(b)b.innerHTML=starBody()},
annForm(){const R=starData();if(!R.length)return toast('Belum ada data absensi pada bulan ini');const o=R[0],ex=S.anns.find(x=>x.bulan===S.tm);
 modal(`<h3>📢 Umumkan Karyawan Teladan</h3><p class="mut">Pengumuman tampil di dasbor semua karyawan dan muncul sebagai pop-up saat mereka membuka aplikasi.</p>
 <div class="row" style="justify-content:center;text-align:center"><div><div style="font-size:46px">🏆</div><b style="font-size:19px">${esc(o.nama)}</b><div>${'⭐'.repeat(o.st)}</div><div class="mut">${blnLbl(S.tm)} • skor ${o.sk} • hadir ${o.h} hr • tepat ${o.on} hr</div></div></div>
 <label>Pesan ucapan (opsional)</label><input class="in" id="an-h" maxlength="80" placeholder="Contoh: Terima kasih atas dedikasinya!" value="${esc(ex?.hadiah||'')}">
 <div class="f" style="margin-top:14px"><button class="btn ok" style="flex:1" onclick="A.annSave()">📢 ${ex?'Perbarui':'Umumkan'} Sekarang</button>${ex?'<button class="btn no" style="flex:0" onclick="A.annDel()">Tarik</button>':''}<button class="btn w" style="flex:0" onclick="A.close()">Batal</button></div>`)},
async annSave(){const o=starData()[0];if(!o)return;const ex=S.anns.find(x=>x.bulan===S.tm),row={bulan:S.tm,karyawan_id:o.id,nama:o.nama,skor:o.sk,bintang:o.st,hadir:o.h,tepat:o.on,hadiah:$('an-h').value.trim()||null,dibuat:new Date().toISOString()};
 try{if(ex)await D.upd('pengumuman',ex.id,row);else await D.ins('pengumuman',row);close();S.annSeen=null;await refresh();toast('📢 Pengumuman terkirim ke semua karyawan')}catch(e){err(e)}},
async annDel(){const ex=S.anns.find(x=>x.bulan===S.tm);if(!ex||!confirm('Tarik pengumuman bulan ini?'))return;try{await D.del('pengumuman',ex.id);close();await refresh();toast('Pengumuman ditarik')}catch(e){err(e)}},
clock(){toast(new Date().toLocaleString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}))},
tmSet(){if($('tm').value){S.tm=$('tm').value;A.star()}},
csv(){csvDown(repRows(),'Rekap_Absensi')},
cfgForm(){const c=S.cfg,t=(i,l,v)=>`<div><label>${l}</label><input class="in" type="time" id="${i}" value="${v}"></div>`,n=(i,l,v)=>`<div><label>${l}</label><input class="in" type="number" step="0.5" id="${i}" value="${v}"></div>`;
 modal(`<h3>⏰ Jam Kerja 2 Shift</h3><form onsubmit="A.saveCfg(event)"><div class="two">${t('c1i','Shift 1 Masuk',c.shift1_in)+t('c1o','Shift 1 Pulang',c.shift1_out)+t('c2i','Shift 2 Masuk',c.shift2_in)+t('c2o','Shift 2 Pulang',c.shift2_out)}</div>
 <div class="two">${n('ct','Toleransi (mnt)',c.toleransi_menit)+n('cj','Target Jam/Hari',c.target_jam)}</div>
 <h4 style="margin:14px 0 0">📍 Lokasi Kantor</h4><div class="two"><div><label>Latitude</label><input class="in" id="cla" type="number" step="any" value="${c.office_lat??''}"></div><div><label>Longitude</label><input class="in" id="clo" type="number" step="any" value="${c.office_lng??''}"></div></div>
 <div class="two"><div><label>Radius (meter)</label><input class="in" id="cr" type="number" value="${c.radius_gps||100}"></div><div style="display:flex;align-items:flex-end"><button type="button" class="btn w" style="width:100%" onclick="A.useMyLoc()">📍 Pakai Lokasi Saya</button></div></div><div class="f" style="margin-top:14px"><button class="btn ok" style="flex:1">✓ Simpan</button><button type="button" class="btn w" onclick="A.close()">Batal</button></div></form>`)},
async saveCfg(ev){ev.preventDefault();const c={shift1_in:$('c1i').value,shift1_out:$('c1o').value,shift2_in:$('c2i').value,shift2_out:$('c2o').value,toleransi_menit:+$('ct').value||0,target_jam:+$('cj').value||8,radius_gps:+$('cr').value||100,office_lat:$('cla').value===''?null:+$('cla').value,office_lng:$('clo').value===''?null:+$('clo').value};
 try{await D.saveCfg(c);S.cfg=c;close();render();toast('Jam shift tersimpan')}catch(e){err(e)}},
purgeForm(){modal(`<h3>🧹 Kosongkan Transaksi</h3><p class="mut">Hanya menghapus log absensi & izin. Data karyawan tetap aman.</p>
 <label>Mode</label><select class="in" id="pm"><option value="3">Lebih lama dari 3 bulan</option><option value="6">Lebih lama dari 6 bulan</option><option value="0">Semua log absensi & izin</option></select>
 <label><input type="checkbox" id="pb" checked> Unduh backup CSV dulu</label><label>Ketik <b>HAPUS</b> untuk konfirmasi</label><input class="in" id="pc">
 <div class="f" style="margin-top:14px"><button class="btn no" style="flex:1" onclick="A.purge()">🗑️ Backup & Kosongkan</button><button class="btn w" onclick="A.close()">Batal</button></div>`)},
async purge(){if($('pc').value.trim().toUpperCase()!=='HAPUS')return toast('Ketik HAPUS untuk konfirmasi');const m=+$('pm').value;let cut=null;if(m){const d=new Date();d.setMonth(d.getMonth()-m);cut=ymd(d)}
 try{if($('pb').checked)csvDown(cut?S.logs.filter(l=>l.tanggal<cut):S.logs,'Backup_Absensi');await D.purge(cut);await rmFoto(cut?S.logs.filter(l=>l.tanggal<cut):S.logs);close();toast('Transaksi dikosongkan');await refresh()}catch(e){err(e)}},
close
};

setInterval(()=>{if(S.role&&!document.hidden&&S.view==='dash'&&$('md').style.display!=='flex'&&$('ovl').style.display!=='flex')refresh()},60000);

 if(!P){if(!db)throw new Error('Supabase gagal dimuat');const r=await db.auth.getSession();if(r.data.session)S.role='ADMIN'}
