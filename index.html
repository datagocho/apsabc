<script>
const IS_PREVIEW=false; // true = uji coba tanpa database | false = 100% Supabase
const SUPABASE_URL="https://oderlxahaxjmgzgtianf.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_QqhPsG0jI925knC_7QauOg_3mwZD01s";
</script>
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
html,body{margin:0;height:100%}
#app{position:fixed;inset:0;z-index:999999;background:linear-gradient(135deg,#f3e8ff,#ffedd5 50%,#e0e7ff);color:#1e1b4b;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
.g{background:rgba(255,255,255,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1.5px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 14px 34px rgba(79,70,229,.1)}
#shell{flex:1;display:none;overflow:hidden}
#side{width:230px;padding:18px;display:flex;flex-direction:column;gap:6px;border-right:1.5px solid #fff;background:rgba(255,255,255,.4)}
#side h1{margin:0 0 12px;font-size:17px}
.nb{display:flex;gap:8px;align-items:center;padding:11px 14px;border:0;border-radius:14px;background:none;font-weight:700;font-size:13px;color:#4338ca;cursor:pointer;width:100%;text-align:left}
.nb.on{background:linear-gradient(90deg,#7c3aed,#4f46e5);color:#fff}
#col{flex:1;display:flex;flex-direction:column;overflow:hidden}
#hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap}
#hdr h2{margin:0;font-size:16px}
#main{flex:1;overflow:auto;padding:6px 18px 90px}
#bot{display:none;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:6px;justify-content:space-around;z-index:5}
#bot .nb{flex-direction:column;gap:0;font-size:10px;padding:6px 8px;width:auto;border-radius:12px}
@media(max-width:1023px){#side{display:none}#bot{display:flex}#hdr{padding-top:calc(12px + env(safe-area-inset-top,0px))}}
.btn{border:0;border-radius:14px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;color:#fff;background:linear-gradient(90deg,#7c3aed,#4f46e5)}
.btn.ok{background:#059669}.btn.no{background:#e11d48}.btn.w{background:#fff;color:#1e1b4b;border:1px solid #ddd}.btn.sm{padding:5px 9px;font-size:11px}
.in{width:100%;padding:9px 12px;border-radius:14px;border:1.5px solid #fff;background:rgba(255,255,255,.8);font-weight:700;font-size:12px;color:#1e1b4b}
label{display:block;font-weight:700;font-size:11px;margin:10px 0 4px;color:#4338ca}
.p{padding:18px;margin-bottom:14px}.p h3{margin:0 0 4px;font-size:15px}.mut{color:#64748b;font-weight:600;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.card{padding:16px;display:flex;gap:12px;align-items:center}.card span{font-size:26px}.card b{display:block;font-size:22px}.card small{font-weight:700;color:#475569}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.65);margin-top:8px;flex-wrap:wrap}
.pill{padding:2px 9px;border-radius:99px;font-size:10px;font-weight:800;background:#e0e7ff;color:#4338ca;display:inline-block}
.pill.g1{background:#d1fae5;color:#047857}.pill.r{background:#ffe4e6;color:#be123c}.pill.y{background:#fef3c7;color:#b45309}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.av{font-size:34px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;font-size:10px;text-transform:uppercase;color:#4338ca;padding:8px}td{padding:8px;border-top:1px solid rgba(99,102,241,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.f>div{flex:1;min-width:130px}
#md{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);z-index:10;align-items:center;justify-content:center;padding:14px}
#md>div{max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:20px;background:rgba(255,255,255,.95)}
#login{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
#login .g{max-width:400px;width:100%;padding:24px}
#toast{display:none;position:fixed;right:14px;bottom:90px;background:#1a0b2e;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;z-index:20;max-width:80vw}
#prev{background:#fef3c7;padding:6px 12px;font-weight:700;font-size:11px;display:none;flex-wrap:wrap;gap:6px;align-items:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(99,102,241,.1);padding:4px;border-radius:14px;margin-bottom:8px}
.tabs button{border:0;padding:8px;border-radius:11px;font-weight:800;background:none;cursor:pointer}.tabs .on{background:#fff}
</style></head>
<body><div id="app">
<div id="prev"><span>🧪 MODE PREVIEW AKTIF (data hanya di memori)</span>
<button class="btn sm" onclick="A.quick('ADMIN')">👑 Quick Admin</button><button class="btn sm ok" onclick="A.quick('STAFF')">👤 Quick Karyawan</button></div>

<div id="login"><div class="g">
<h2 style="margin:0">🔑 StaffCentral Indonesia</h2><p class="mut">Masuk untuk melanjutkan</p>
<div class="tabs"><button id="t-s" class="on" onclick="A.tab('S')">Karyawan</button><button id="t-a" onclick="A.tab('A')">Admin HR</button></div>
<form id="fs" onsubmit="A.loginStaff(event)"><label>Nama Karyawan</label><input class="in" id="ls-n" autocomplete="off" required>
<label>PIN</label><input class="in" id="ls-p" type="password" inputmode="numeric" required>
<button class="btn ok" style="width:100%;margin-top:14px">Masuk Sebagai Karyawan</button></form>
<form id="fa" style="display:none" onsubmit="A.loginAdmin(event)"><label>Email Admin</label><input class="in" id="la-e" type="email" required>
<label>Password</label><input class="in" id="la-p" type="password" required>
<button class="btn" style="width:100%;margin-top:14px">Masuk Sebagai Admin</button></form>
</div></div>

<div id="shell"><aside id="side"></aside><div id="col"><header id="hdr" class="g" style="margin:10px 18px 6px"></header><div id="main"></div></div></div>
<nav id="bot" class="g"></nav>
<div id="md"><div class="g" id="mdc"></div></div><div id="toast"></div>
</div>
<script>
(()=>{
const P=IS_PREVIEW,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const mins=t=>{const[a,b]=String(t).split(':');return+a*60+ +b};
const dur=m=>Math.floor(m/60)+'j '+(m%60)+'m';
const AV={pria:'👨',wanita:'👩',hijab:'🧕'};
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const DEF={shift1_in:'07:00',shift1_out:'15:00',shift2_in:'15:00',shift2_out:'23:00',toleransi_menit:15,target_jam:8,radius_gps:100,office_lat:null,office_lng:null};
let db=null;if(!P){try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){console.error(e)}}
const S={role:null,me:null,view:'dash',emps:[],logs:[],leaves:[],cfg:{...DEF},f:{s:ymd(new Date(new Date().getFullYear(),new Date().getMonth(),1)),e:ymd(new Date()),emp:'ALL'}};

// ===== PREVIEW: data minimalis di memori =====
const M={karyawan:[{id:'p1',nik:'EMP-001',nama:'Bella Putri',pin_password:'123456',shift_default:'SHIFT_1',avatar_style:'wanita',tanggal_bergabung:ymd(new Date()),jadwal_minggu:['SHIFT_1','SHIFT_1','SHIFT_1','SHIFT_1','SHIFT_1','LIBUR','LIBUR']},{id:'p2',nik:'EMP-002',nama:'Rizky Pratama',pin_password:'123456',shift_default:'SHIFT_2',avatar_style:'pria',tanggal_bergabung:ymd(new Date()),jadwal_minggu:['SHIFT_2','SHIFT_2','SHIFT_2','SHIFT_2','SHIFT_2','LIBUR','LIBUR']}],
absensi:[{id:'pa1',karyawan_id:'p1',nama_karyawan:'Bella Putri',tanggal:ymd(new Date()),shift_kode:'SHIFT_1',waktu_masuk:'06:58',waktu_pulang:'15:02',durasi_menit:484,menit_terlambat:0,status_kehadiran:'Tepat Waktu',status_lokasi:'Terminal Admin'}],
izin:[{id:'pi1',karyawan_id:'p2',nama_karyawan:'Rizky Pratama',jenis_izin:'Sakit',tanggal_mulai:ymd(new Date()),tanggal_selesai:ymd(new Date()),jumlah_hari:1,alasan:'Demam',info_lampiran:'-',status_approval:'Menunggu'}],pengaturan_shift:[]};

// ===== LAPISAN DATABASE (Supabase asli / memori saat preview) =====
const D={
async list(t,c,v){if(P)return M[t].filter(r=>!c||r[c]===v).map(r=>({...r}));let x=db.from(t).select('*');if(c)x=x.eq(c,v);const r=await x;if(r.error)throw r.error;return r.data},
async ins(t,row){if(P){row={id:'p'+Math.random().toString(36).slice(2),...row};M[t].push(row);return row}const r=await db.from(t).insert(row).select().single();if(r.error)throw r.error;return r.data},
async upd(t,id,p){if(P){Object.assign(M[t].find(x=>x.id===id),p);return}const r=await db.from(t).update(p).eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error('Ditolak oleh RLS / data tidak ditemukan')},
async del(t,id){if(P){M[t]=M[t].filter(x=>x.id!==id);return}const r=await db.from(t).delete().eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error('Ditolak oleh RLS / data tidak ditemukan')},
async saveCfg(c){if(P)return;const r=await db.from('pengaturan_shift').upsert({id:1,...c});if(r.error)throw r.error},
async purge(cut){for(const[t,c]of[['absensi','tanggal'],['izin','tanggal_mulai']]){if(P){M[t]=cut?M[t].filter(r=>r[c]>=cut):[];continue}let x=db.from(t).delete();x=cut?x.lt(c,cut):x.not('id','is',null);const r=await x;if(r.error)throw r.error}}
};

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',3400)}
const err=e=>{console.error(e);toast('⚠️ '+(e.message||e))};
const emp=id=>S.emps.find(e=>e.id===id);
const isA=()=>S.role==='ADMIN';
const shLbl=c=>c==='SHIFT_1'?`Shift 1 (${S.cfg.shift1_in}-${S.cfg.shift1_out})`:c==='SHIFT_2'?`Shift 2 (${S.cfg.shift2_in}-${S.cfg.shift2_out})`:c==='IZIN'?'Izin/Sakit':'Libur';
const todayIdx=()=>(new Date().getDay()+6)%7;
const stPill=s=>`<span class="pill ${s==='Tepat Waktu'?'g1':s==='Terlambat'?'y':'r'}">${esc(s)}</span>`;

async function loadData(){
 const st=S.role==='STAFF',[e,l,v,c]=await Promise.all([st?D.list('karyawan','id',S.me):D.list('karyawan'),st?D.list('absensi','karyawan_id',S.me):D.list('absensi'),st?D.list('izin','karyawan_id',S.me):D.list('izin'),D.list('pengaturan_shift')]);
 S.emps=e.sort((a,b)=>(a.nik||'').localeCompare(b.nik||''));
 S.logs=l.sort((a,b)=>(b.tanggal+(b.waktu_masuk||'')).localeCompare(a.tanggal+(a.waktu_masuk||'')));
 S.leaves=v.sort((a,b)=>(b.tanggal_mulai||'').localeCompare(a.tanggal_mulai||''));
 S.cfg={...DEF,...(c[0]||{})};
}
async function refresh(){try{await loadData();render()}catch(e){err(e)}}

// ===== TAMPILAN =====
const NAV=[['dash','📊','Dasbor',0],['scan','📷','Absen',0],['emps','👥','Karyawan',1],['sched','🗓️','Jadwal',0],['leave','🏥','Izin/Sakit',0],['rep','📈','Rekap',0]];
const TTL={dash:'Dasbor',scan:'Absensi Wajah & Lokasi',emps:'Data Karyawan',sched:'Jadwal 2 Shift',leave:'Pengajuan Izin / Sakit',rep:'Rekap Jam Kerja'};
const logRow=l=>`<div class="row"><div><b>${esc(l.nama_karyawan)}</b> <span class="pill">${esc(l.shift_kode)}</span><div class="mut">${esc(l.tanggal)} • ${esc(l.waktu_masuk)} - ${esc(l.waktu_pulang)} • ${dur(l.durasi_menit||0)}${l.jarak_meter!=null?' • 📍'+l.jarak_meter+' m':''}${l.skor_wajah!=null?' • 🙂'+l.skor_wajah+'%':''}</div></div>${stPill(l.status_kehadiran)}</div>`;
const empty=t=>`<div class="mut" style="padding:14px;text-align:center">${t}</div>`;

const V={
dash(){const t=ymd(new Date()),ym=t.slice(0,7),card=(i,l,v)=>`<div class="g card"><span>${i}</span><div><small>${l}</small><b>${v}</b></div></div>`;
 if(isA()){const L=S.logs.filter(l=>l.tanggal===t&&l.shift_kode!=='IZIN'),n1=S.emps.filter(e=>e.shift_default==='SHIFT_1').length;
  return `<div class="cards">${card('👥','Total Karyawan',S.emps.length)+card('✅','Hadir Hari Ini',L.length)+card('⏰','Terlambat Hari Ini',L.filter(l=>l.menit_terlambat>0).length)+card('🏥','Izin Menunggu',S.leaves.filter(v=>v.status_approval==='Menunggu').length)}</div>
  <div class="g p"><h3>Komposisi Shift</h3><div class="row"><span>${shLbl('SHIFT_1')}</span><b>${n1} staf</b></div><div class="row"><span>${shLbl('SHIFT_2')}</span><b>${S.emps.length-n1} staf</b></div></div>
  <div class="g p"><h3>Absensi Hari Ini</h3>${L.map(logRow).join('')||empty('Belum ada absensi hari ini.')}</div>`}
 const me=emp(S.me),M2=S.logs.filter(l=>l.tanggal.startsWith(ym)&&l.shift_kode!=='IZIN');
 return `<div class="cards">${card('👤','Karyawan',esc(me?.nama||'-'))+card('🗓️','Shift Hari Ini',me?shLbl(me.jadwal_minggu?.[todayIdx()]||'LIBUR'):'-')+card('✅','Hadir Bulan Ini',M2.length+' hari')+card('⏱️','Total Jam Bulan Ini',dur(M2.reduce((a,l)=>a+(l.durasi_menit||0),0)))}</div>
 <div class="g p"><h3>Absensi Terakhir Saya</h3>${S.logs.slice(0,6).map(logRow).join('')||empty('Belum ada riwayat absensi.')}</div>`},
scan(){const t=ymd(new Date()),L=S.logs.filter(l=>l.tanggal===t&&(isA()||l.karyawan_id===S.me)),
 cam='<div style="position:relative;max-width:320px;margin:10px auto;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#0f172a"><video id="cam" playsinline muted style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1)"></video><div id="camst" style="position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-weight:800;font-size:11px;color:#fff;background:rgba(0,0,0,.55);border-radius:10px;padding:5px">Kamera belum aktif</div></div>',
 logs=`<div class="g p"><h3>Log Hari Ini</h3>${L.map(logRow).join('')||empty('Belum ada log.')}</div>`;
 if(isA()){const o=S.emps.map(e=>`<option value="${e.id}">${e.face_descriptor?'🙂':'⚠️'} ${esc(e.nama)} (${esc(e.nik)})</option>`).join('');
  return `<div class="g p"><h3>Terminal Absensi (Admin)</h3><p class="mut">Check-in/out manual oleh admin & pendaftaran wajah. ⚠️ = wajah belum terdaftar. Karyawan absen mandiri lewat HP masing-masing (wajah + lokasi).</p>
 <div class="two"><div><label>Karyawan</label><select class="in" id="sc-emp" onchange="A.scDef()">${o}</select></div><div><label>Shift</label><select class="in" id="sc-shift"><option value="SHIFT_1">${shLbl('SHIFT_1')}</option><option value="SHIFT_2">${shLbl('SHIFT_2')}</option></select></div></div>${cam}
 <div class="f" style="margin-top:8px;justify-content:center"><button class="btn ok" style="flex:0" onclick="A.scan('IN')">📥 Check-In</button><button class="btn" style="flex:0" onclick="A.scan('OUT')">📤 Check-Out</button><button class="btn w" style="flex:0" onclick="A.enrollSel()">🙂 Daftar / Ulang Wajah</button></div></div>`+logs}
 const me=emp(S.me),sh=me?.jadwal_minggu?.[todayIdx()]||'LIBUR',lok=S.cfg.office_lat!=null;
 return `<div class="g p"><h3>Absensi Wajah & Lokasi</h3><p class="mut">Jadwal hari ini: <b>${shLbl(sh)}</b> • Radius kantor ${S.cfg.radius_gps} m ${lok?'':'• ⚠️ Admin belum mengatur lokasi kantor'}</p>${cam}
 <div id="gst" class="mut" style="text-align:center">📍 Lokasi: belum dicek</div>
 <div class="f" style="margin-top:12px;justify-content:center">${me?.face_descriptor?'':'<button class="btn" style="flex:0" onclick="A.enroll(\''+S.me+'\')">🙂 Daftarkan Wajah Saya</button>'}<button class="btn ok" style="flex:0" onclick="A.selfPunch('IN')">📥 Check-In</button><button class="btn" style="flex:0" onclick="A.selfPunch('OUT')">📤 Check-Out</button></div>
 <p class="mut" style="text-align:center">${me?.face_descriptor?'🙂 Wajah sudah terdaftar':'⚠️ Daftarkan wajah dulu sebelum absen'}</p></div>`+logs},
emps(){return `<div class="g p f"><div><h3>Data Karyawan</h3><span class="mut">Tersimpan permanen di database</span></div><div><input class="in" id="es" placeholder="Cari nama / NIK..." oninput="A.grid()"></div><button class="btn" style="flex:0" onclick="A.empForm()">+ Tambah</button></div><div class="grid" id="eg"></div>`},
sched(){const list=isA()?S.emps:S.emps.filter(e=>e.id===S.me);
 return `<div class="g p f"><div><h3>Jadwal Roster Mingguan</h3><span class="mut">${isA()?'Klik tombol shift untuk mengganti (otomatis tersimpan)':'Jadwal Anda (baca saja)'}</span></div>${isA()?'<button class="btn ok" style="flex:0" onclick="A.rotate()">🔄 Tukar Shift</button>':''}</div>
 <div class="g p tw"><table><thead><tr><th>Nama</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${list.map(e=>`<tr><td><b>${esc(e.nama)}</b></td>${(e.jadwal_minggu||[]).map((s,i)=>{const c=s==='SHIFT_1'?'g1':s==='SHIFT_2'?'':'r',l=s==='SHIFT_1'?'Shift 1':s==='SHIFT_2'?'Shift 2':'Libur';return `<td>${isA()?`<button class="btn sm w pill ${c}" onclick="A.cyc('${e.id}',${i})">${l}</button>`:`<span class="pill ${c}">${l}</span>`}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="8">${empty('Belum ada karyawan.')}</td></tr>`}</tbody></table></div>`},
leave(){const o=(isA()?S.emps:S.emps.filter(e=>e.id===S.me)).map(e=>`<option value="${e.id}">${esc(e.nama)}</option>`).join(''),t=ymd(new Date());
 return `<div class="g p"><h3>Form Pengajuan</h3><form onsubmit="A.sendLeave(event)"><label>Karyawan</label><select class="in" id="lv-e">${o}</select>
 <label>Jenis</label><select class="in" id="lv-t"><option>Sakit</option><option>Izin Keperluan</option><option>Cuti Tahunan</option><option>Dinas Luar</option></select>
 <div class="two"><div><label>Dari</label><input type="date" class="in" id="lv-s" value="${t}" required></div><div><label>Sampai</label><input type="date" class="in" id="lv-n" value="${t}" required></div></div>
 <label>Alasan</label><textarea class="in" id="lv-r" rows="2" required></textarea><label>No. Surat / Info Lampiran</label><input class="in" id="lv-a">
 <button class="btn" style="width:100%;margin-top:14px">📤 Kirim Pengajuan</button></form></div>
 <div class="g p"><h3>Daftar Pengajuan</h3>${S.leaves.map(v=>`<div class="row"><div><b>${esc(v.nama_karyawan)}</b> <span class="pill">${esc(v.jenis_izin)}</span><div class="mut">${esc(v.tanggal_mulai)} s.d. ${esc(v.tanggal_selesai)} (${v.jumlah_hari} hr) • ${esc(v.alasan)} • ${esc(v.info_lampiran||'-')}</div></div>
 <div>${v.status_approval==='Menunggu'&&isA()?`<button class="btn ok sm" onclick="A.appr('${v.id}',1)">✓ Setujui</button> <button class="btn no sm" onclick="A.appr('${v.id}',0)">✕ Tolak</button>`:`<span class="pill ${v.status_approval==='Disetujui'?'g1':v.status_approval==='Ditolak'?'r':'y'}">${esc(v.status_approval)}</span>`}</div></div>`).join('')||empty('Belum ada pengajuan.')}</div>`},

const FACE_T=0.5,MURL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';let FA={ready:false,stream:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const camSt=m=>{const e=$('camst');if(e)e.textContent=m},geoSt=m=>{const e=$('gst');if(e)e.textContent=m};
function camOff(){if(FA.stream){FA.stream.getTracks().forEach(t=>t.stop());FA.stream=null}}
async function faceLoad(){if(FA.ready)return;if(!window.faceapi)throw new Error('Library wajah gagal dimuat, cek koneksi internet');await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MURL),faceapi.nets.faceLandmark68Net.loadFromUri(MURL),faceapi.nets.faceRecognitionNet.loadFromUri(MURL)]);FA.ready=true}
async function camOn(){if(!navigator.mediaDevices)throw new Error('Kamera butuh koneksi HTTPS');if(!FA.stream)FA.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:480,height:480},audio:false}).catch(()=>{throw new Error('Izin kamera ditolak. Aktifkan kamera untuk situs ini.')});const v=$('cam');v.srcObject=FA.stream;await v.play()}
async function faceGrab(n=8){for(let i=0;i<n;i++){const r=await faceapi.detectSingleFace($('cam'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(r)return Array.from(r.descriptor);await sleep(400)}return null}
const fdist=(a,b)=>Math.sqrt(a.reduce((q,x,i)=>q+(x-b[i])**2,0));
const geo=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Browser tidak mendukung GPS'));navigator.geolocation.getCurrentPosition(p=>ok(p.coords),e=>no(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan lokasi untuk situs ini.':'Gagal membaca lokasi, coba di area terbuka')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))};

 try{if(mode==='IN'){if(open)return toast('Sudah check-in & belum check-out');
  const late=Math.max(0,mins(w)-mins(sh==='SHIFT_1'?S.cfg.shift1_in:S.cfg.shift2_in)),tl=late>S.cfg.toleransi_menit?late:0;
  await D.ins('absensi',{karyawan_id:id,nama_karyawan:e.nama,tanggal:t,shift_kode:sh,waktu_masuk:w,waktu_pulang:'-',durasi_menit:0,menit_terlambat:tl,status_kehadiran:tl?'Terlambat':'Tepat Waktu',...meta});toast('Check-in '+e.nama+' '+w+(tl?' (terlambat '+tl+' mnt)':''))}
 else{if(!open)return toast('Belum ada check-in aktif hari ini');let d=mins(w)-mins(open.waktu_masuk);if(d<0)d+=1440;await D.upd('absensi',open.id,{waktu_pulang:w,durasi_menit:d});toast('Check-out '+e.nama+' ('+dur(d)+')')}
 await refresh()}catch(x){err(x)}}

 <label>Mode</label><select class="in" id="pm"><option value="3">Lebih lama dari 3 bulan</option><option value="6">Lebih lama dari 6 bulan</option><option value="0">Semua log absensi & izin</option></select>
 <label><input type="checkbox" id="pb" checked> Unduh backup CSV dulu</label><label>Ketik <b>HAPUS</b> untuk konfirmasi</label><input class="in" id="pc">
 <div class="f" style="margin-top:14px"><button class="btn no" style="flex:1" onclick="A.purge()">🗑️ Backup & Kosongkan</button><button class="btn w" onclick="A.close()">Batal</button></div>`)},
async purge(){if($('pc').value.trim().toUpperCase()!=='HAPUS')return toast('Ketik HAPUS untuk konfirmasi');const m=+$('pm').value;let cut=null;if(m){const d=new Date();d.setMonth(d.getMonth()-m);cut=ymd(d)}
 try{if($('pb').checked)csvDown(cut?S.logs.filter(l=>l.tanggal<cut):S.logs,'Backup_Absensi');await D.purge(cut);close();toast('Transaksi dikosongkan');await refresh()}catch(e){err(e)}},
close
};

// ===== BOOT =====
(async()=>{try{
 if(!P){if(!db)throw new Error('Supabase gagal dimuat');const r=await db.auth.getSession();if(r.data.session)S.role='ADMIN'}
 if(!S.role){let id=null;try{id=localStorage.getItem('sc_me')}catch(_){}if(id&&!P){const r=await D.list('karyawan','id',id);if(r[0]){S.role='STAFF';S.me=id}}}
 if(S.role)await loadData()}catch(e){err(e)}render()})();
})();
</script></body></html>
