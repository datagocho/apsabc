 let all=[],i=0;for(;;){const{data,error}=await mk().range(i,i+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;i+=1000}return all}

function scanFace(desc,thr){let open=false,blink=false;const ref=new Float32Array(desc);
 return camera('Hadapkan wajah ke kamera lalu berkedip',(det,vd,vm)=>{const e=(ear(det.landmarks.getLeftEye())+ear(det.landmarks.getRightEye()))/2;if(e>.27)open=true;if(open&&e<.2)blink=true;
  const dist=faceapi.euclideanDistance(det.descriptor,ref);if(dist>thr){vm.textContent='Wajah tidak cocok…';return}
  if(!blink){vm.textContent='Wajah cocok. Silakan berkedip';return}return{foto:snap(vd),skor:+(1-dist).toFixed(3)}})}
async function daftarWajah(id){try{if(P){await upd('karyawan',id,{face_descriptor:Array(128).fill(0)})}else{const buf=[],ds=await camera('Hadap lurus ke kamera, jangan bergerak',(det,vd,vm)=>{buf.push(Array.from(det.descriptor));vm.textContent=`Mengambil sampel (${buf.length}/5)`;return buf.length>=5?buf:null});const avg=ds[0].map((_,i)=>ds.reduce((s,x)=>s+x[i],0)/ds.length);await upd('karyawan',id,{face_descriptor:avg})}toast('Wajah berhasil didaftarkan');render()}catch(e){toast(e.message,1)}}

async function absen(j){try{const t=today();const js=await sel('jadwal_shift',{eq:{karyawan_id:me.id,tanggal:t}}),sh=shifts.find(s=>s.id==js[0]?.shift_id);if(!sh)throw Error('Tidak ada jadwal shift hari ini');

 if(!P){if(cfg.wajib_gps){pos=await gps();const d=jarak(pos.latitude,pos.longitude,cfg.lat,cfg.lng);if(d>cfg.radius_m)throw Error(`Anda ${Math.round(d)} m dari kantor (maks ${cfg.radius_m} m)`)}
  if(!me.face_descriptor)throw Error('Wajah belum didaftarkan. Hubungi admin.');const r=await scanFace(me.face_descriptor,cfg.ambang_wajah);foto=r.foto;skor=r.skor}

 if(j=='masuk'){const[h,m]=sh.jam_masuk.split(':'),st=new Date();st.setHours(h,m,0,0);const late=Math.max(0,Math.floor((now-st)/6e4)),tl=late>cfg.toleransi_menit;
  await ups('absensi',[{karyawan_id:me.id,tanggal:t,shift_id:sh.id,jam_masuk:now.toISOString(),foto_masuk:foto,skor_wajah:skor,lat:pos.latitude??null,lng:pos.longitude??null,status:tl?'terlambat':'hadir',terlambat_menit:tl?late:0}],['karyawan_id','tanggal'])}
 else{if(!ex?.jam_masuk)throw Error('Belum absen masuk');await ups('absensi',[{karyawan_id:me.id,tanggal:t,jam_pulang:now.toISOString(),foto_pulang:foto,total_jam:+((now-new Date(ex.jam_masuk))/36e5).toFixed(2)}],['karyawan_id','tanggal'])}
 toast('Absen '+j+' berhasil');render()}catch(e){toast(e.message,1)}}

 const rows=ks.filter(k=>role=='admin'?k.aktif:k.id==me.id).map(k=>{const a=ab.filter(x=>x.karyawan_id==k.id),has=new Set(a.map(x=>x.tanggal)),c=q=>a.filter(x=>x.status==q).length;
  return{k,hadir:c('hadir')+c('terlambat'),tl:c('terlambat'),tlm:a.reduce((x,y)=>x+(y.terlambat_menit||0),0),izin:c('izin'),sakit:c('sakit'),cuti:c('cuti'),alpha:c('alpha')+js.filter(x=>x.karyawan_id==k.id&&x.tanggal<t&&!has.has(x.tanggal)).length,jam:+a.reduce((x,y)=>x+(+y.total_jam||0),0).toFixed(1)}});
 return{rows,ab,ks}}

 const[ks,pj]=await Promise.all([sel('karyawan',{order:'kode'}),sel('jadwal_shift',{gte:{tanggal:pd[0]},lte:{tanggal:pd[5]}})]),A=ks.filter(k=>k.aktif),rows=[];
 A.forEach((k,i)=>{const p=pj.find(j=>j.karyawan_id==k.id),pi=p?shifts.findIndex(s=>s.id==p.shift_id):i%2,s=shifts[(pi+1)%shifts.length];ds.forEach(d=>rows.push({karyawan_id:k.id,tanggal:d,shift_id:s.id}))});
 if(!confirm(`Terapkan rotasi shift untuk ${A.length} karyawan? Jadwal minggu ini akan ditimpa (shift berbalik dari minggu lalu).`))return;await ups('jadwal_shift',rows,['karyawan_id','tanggal']);toast('Rotasi diterapkan');render()}catch(e){toast(e.message,1)}}
V.abs=async()=>{const[ks,ab,js]=await Promise.all([sel('karyawan',{order:'nama'}),sel('absensi',{eq:{tanggal:ad}}),sel('jadwal_shift',{eq:{tanggal:ad}})]);
 return H('Data Absensi','',`<input type=date value=${ad} style="width:auto;margin:0" onchange="ad=this.value;render()">`)+`<div class=c>${tbl(['Karyawan','Shift','Masuk','Pulang','Jam','Status','Foto',''],ks.filter(k=>k.aktif).map(k=>{const a=ab.find(x=>x.karyawan_id==k.id),j=js.find(x=>x.karyawan_id==k.id),s=shifts.find(x=>x.id==(a?.shift_id||j?.shift_id));
  return`<tr><td>${esc(k.nama)}</td><td>${s?chip(s):'-'}</td><td>${hm(a?.jam_masuk)}</td><td>${hm(a?.jam_pulang)}</td><td>${a?.total_jam??'-'}</td><td>${stat(a?.status||(j?'belum':'libur'))}</td><td>${a?.foto_masuk?`<img class=th src="${a.foto_masuk}">`:''}</td><td><button class="bt l sm" onclick="koreksi('${k.id}','${s?.id||''}')">Koreksi</button>${a?` <button class="bt r sm" onclick="hapusAbs('${k.id}')">Hapus</button>`:''}</td></tr>`}).join(''))}</div>`};
async function koreksi(kid,sid){const a=(await sel('absensi',{eq:{karyawan_id:kid,tanggal:ad}}))[0]||{},tm=x=>x?hm(x):'';
 modal('Koreksi Absensi',`<label>Status</label><select name=st>${['hadir','terlambat','izin','sakit','cuti','alpha'].map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select><label>Shift</label><select name=sh>${shifts.map(s=>`<option value="${s.id}" ${s.id==(a.shift_id||sid)?'selected':''}>${esc(s.nama)}</option>`).join('')}</select><label>Jam Masuk</label><input type=time name=im value="${tm(a.jam_masuk)}"><label>Jam Pulang</label><input type=time name=ip value="${tm(a.jam_pulang)}">`,async d=>{
  const im=v(d,'im'),ip=v(d,'ip'),T=x=>x?new Date(ad+'T'+x).toISOString():null,mi=T(im),po=T(ip),s=shifts.find(x=>x.id==v(d,'sh'));let late=0;if(mi&&s&&v(d,'st')=='terlambat')late=Math.max(0,Math.round((new Date(mi)-new Date(ad+'T'+s.jam_masuk))/6e4));
  await ups('absensi',[{karyawan_id:kid,tanggal:ad,shift_id:s?.id||null,status:v(d,'st'),jam_masuk:mi,jam_pulang:po,terlambat_menit:late,total_jam:mi&&po?+((new Date(po)-new Date(mi))/36e5).toFixed(2):null}],['karyawan_id','tanggal']);toast('Tersimpan');render()})}
V.acc=async()=>{const[l,ks]=await Promise.all([sel('pengajuan',{order:'created_at'}),sel('karyawan')]);l.reverse();const kn=Object.fromEntries(ks.map(k=>[k.id,k]));
 return H('Persetujuan Pengajuan','Izin, sakit, dan cuti')+`<div class=c>${tbl(['Karyawan','Jenis','Tanggal','Hari','Alasan','Lampiran','Status',''],l.map(p=>`<tr><td>${esc(kn[p.karyawan_id]?.nama)}</td><td>${p.jenis}</td><td>${fmtTgl(p.tgl_mulai)} – ${fmtTgl(p.tgl_selesai)}</td><td>${p.jumlah_hari}</td><td>${esc(p.alasan)}</td><td>${p.lampiran?`<a href="${p.lampiran}" download="lampiran">Unduh</a>`:'-'}</td><td>${stat(p.status)}</td><td>${p.status=='menunggu'?`<button class="bt g sm" onclick="proses('${p.id}',1)">Setujui</button> <button class="bt r sm" onclick="proses('${p.id}',0)">Tolak</button>`:''} <button class="bt l sm" onclick="hapusAjuan('${p.id}')">Hapus</button></td></tr>`).join(''))}</div>`};
async function proses(id,ok){try{const p=(await sel('pengajuan',{eq:{id}}))[0];if(!p||p.status!='menunggu')return render();const cat=prompt(ok?'Catatan (opsional):':'Alasan penolakan:');if(cat===null)return;
 if(ok){const k=(await sel('karyawan',{eq:{id:p.karyawan_id}}))[0];if(p.jenis=='cuti'&&k.sisa_cuti<p.jumlah_hari)throw Error('Sisa cuti karyawan tidak cukup');
  const ds=dates(p.tgl_mulai,p.tgl_selesai).filter(d=>new Date(d+'T00:00').getDay()!=0),js=await sel('jadwal_shift',{eq:{karyawan_id:p.karyawan_id},gte:{tanggal:p.tgl_mulai},lte:{tanggal:p.tgl_selesai}});
  await ups('absensi',ds.map(d=>({karyawan_id:p.karyawan_id,tanggal:d,shift_id:js.find(j=>j.tanggal==d)?.shift_id||null,status:p.jenis,terlambat_menit:0})),['karyawan_id','tanggal']);
  if(p.jenis=='cuti')await upd('karyawan',k.id,{sisa_cuti:k.sisa_cuti-p.jumlah_hari})}
 await upd('pengajuan',id,{status:ok?'disetujui':'ditolak',catatan_admin:cat,diproses_pada:new Date().toISOString()});toast(ok?'Pengajuan disetujui':'Pengajuan ditolak');render()}catch(e){toast(e.message,1)}}
async function hapusAbs(k){if(!confirm('Hapus data absensi karyawan ini pada '+fmtTgl(ad)+'?'))return;try{await del('absensi',{karyawan_id:k,tanggal:ad});toast('Absensi dihapus');render()}catch(e){toast(e.message,1)}}
async function hapusAjuan(id){if(!confirm('Hapus pengajuan ini? Absensi dan sisa cuti yang sudah terbentuk tidak berubah otomatis.'))return;try{await del('pengajuan',{id});toast('Pengajuan dihapus');render()}catch(e){toast(e.message,1)}}
const cutoff=()=>{const d=new Date();d.setMonth(d.getMonth()-(+$('#cl').value));return ymd(d)};
async function bersihFoto(){try{const c=cutoff();if(!confirm(`Hapus foto bukti absen sebelum ${fmtTgl(c)}? Jam kerja dan status tetap tersimpan.`))return;await bulk('absensi','tanggal',c,{foto_masuk:null,foto_pulang:null});toast('Foto lama dibersihkan')}catch(e){toast(e.message,1)}}
async function hapusLama(){try{const c=cutoff();if(prompt(`Ini menghapus SEMUA absensi dan pengajuan (selain yang masih menunggu) sebelum ${fmtTgl(c)}. Rekap bulan-bulan itu ikut hilang, jadi unduh Excel dulu. Sisa cuti tidak berubah.\n\nKetik HAPUS untuk melanjutkan:`)!=='HAPUS')return;await bulk('absensi','tanggal',c);await bulk('pengajuan','tgl_selesai',c);toast('Transaksi lama dihapus')}catch(e){toast(e.message,1)}}
V.set=async()=>{const i=(n,l,x,t='text',e='')=>`<label>${l}</label><input name=${n} type=${t} ${e} value="${esc(x??'')}">`;
 return H('Pengaturan')+`<div class=c style="max-width:560px" id=sf>${i('nm','Nama Perusahaan',cfg.nama_perusahaan)}${i('tl','Toleransi Terlambat (menit)',cfg.toleransi_menit,'number')}${i('am','Ambang Kecocokan Wajah (0.3 ketat – 0.6 longgar)',cfg.ambang_wajah,'number','step=0.05')}${i('kc','Kuota Cuti Tahunan (hari)',cfg.kuota_cuti,'number')}<label>Wajib Berada di Radius Kantor (GPS)</label><select name=gp><option value=1 ${cfg.wajib_gps?'selected':''}>Ya</option><option value=0 ${cfg.wajib_gps?'':'selected'}>Tidak</option></select>${i('la','Latitude Kantor',cfg.lat,'number','step=any')}${i('lo','Longitude Kantor',cfg.lng,'number','step=any')}${i('rd','Radius (meter)',cfg.radius_m,'number')}<button class="bt l" onclick=lokasiSaya()><i data-lucide=map-pin></i>Pakai lokasi saya sekarang</button> <button class=bt onclick=simpanSet()>Simpan</button><hr style="margin:18px 0;border:0;border-top:1px solid var(--br)"><button class="bt r" onclick=resetCuti()>Terapkan kuota cuti ke semua karyawan</button><hr style="margin:18px 0;border:0;border-top:1px solid var(--br)"><h4>Pembersihan Data</h4><p class=lb style="margin:4px 0 8px">Berlaku untuk data yang lebih lama dari:</p><select id=cl style="width:auto"><option value=1>1 bulan</option><option value=3 selected>3 bulan</option><option value=6>6 bulan</option><option value=12>12 bulan</option></select><br><button class="bt l" onclick=bersihFoto()>Bersihkan foto lama</button> <button class="bt r" onclick=hapusLama()>Hapus transaksi lama</button></div>`};
async function lokasiSaya(){try{const p=await gps(),f=$('#sf');f.querySelector('[name=la]').value=p.latitude;f.querySelector('[name=lo]').value=p.longitude;toast('Lokasi terisi')}catch(e){toast(e.message,1)}}
async function simpanSet(){try{const f=$('#sf'),g=n=>f.querySelector(`[name=${n}]`).value;await upd('pengaturan',cfg.id,{nama_perusahaan:g('nm'),toleransi_menit:+g('tl'),ambang_wajah:+g('am'),kuota_cuti:+g('kc'),wajib_gps:g('gp')=='1',lat:g('la')===''?null:+g('la'),lng:g('lo')===''?null:+g('lo'),radius_m:+g('rd')});await loadBase();toast('Pengaturan disimpan')}catch(e){toast(e.message,1)}}
async function resetCuti(){if(!confirm('Set sisa cuti SEMUA karyawan menjadi '+cfg.kuota_cuti+' hari?'))return;try{for(const k of await sel('karyawan'))await upd('karyawan',k.id,{sisa_cuti:cfg.kuota_cuti});toast('Kuota cuti diterapkan')}catch(e){toast(e.message,1)}}

// ===== PWA & BOOT =====
try{if('serviceWorker'in navigator){const u=URL.createObjectURL(new Blob(["self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('fetch',()=>{});"],{type:'text/javascript'}));navigator.serviceWorker.register(u).catch(()=>{})}}catch(e){}
(async function boot(){try{
 if(P){await seedPreview();return loginUI()}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const{data}=await sb.auth.getSession();if(data.session){role='admin';me={nama:data.session.user.email};await loadBase();view='dash';return shell()}
 const id=ls('abs_u');if(id){const r=(await sel('karyawan',{eq:{id}}))[0];if(r&&r.aktif){me=r;role='user';await loadBase();view='home';return shell()}}
 loginUI()}catch(e){loginUI();toast('Gagal terhubung: '+e.message,1)}})();
</script>
