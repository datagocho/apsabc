<script>
(()=>{
const P=IS_PREVIEW,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const mins=t=>{const[a,b]=String(t).split(':');return+a*60+ +b};
const dur=m=>Math.floor(m/60)+'j '+(m%60)+'m';
const AV={pria:'👨',wanita:'👩',hijab:'🧕'};
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const DEF={shift1_in:'07:00',shift1_out:'15:00',shift2_in:'15:00',shift2_out:'23:00',toleransi_menit:15,target_jam:8,radius_gps:100,office_lat:null,office_lng:null};
let db=null;if(!P){try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){console.error(e)}}
const S={role:null,me:null,view:'dash',tm:ymd(new Date()).slice(0,7),tl:[],nc:null,emps:[],logs:[],leaves:[],cfg:{...DEF},f:{s:ymd(new Date(new Date().getFullYear(),new Date().getMonth(),1)),e:ymd(new Date()),emp:'ALL'}};

// ===== PREVIEW: data minimalis di memori =====
const M={karyawan:[{id:'p1',nik:'EMP-001',nama:'Bella Putri',pin_password:'123456',shift_default:'SHIFT_1',avatar_style:'wanita',tanggal_bergabung:ymd(new Date()),jadwal_minggu:['SHIFT_1','SHIFT_1','SHIFT_1','SHIFT_1','SHIFT_1','LIBUR','LIBUR']},{id:'p2',nik:'EMP-002',nama:'Rizky Pratama',pin_password:'123456',shift_default:'SHIFT_2',avatar_style:'pria',tanggal_bergabung:ymd(new Date()),jadwal_minggu:['SHIFT_2','SHIFT_2','SHIFT_2','SHIFT_2','SHIFT_2','LIBUR','LIBUR']}],
absensi:[{id:'pa1',karyawan_id:'p1',nama_karyawan:'Bella Putri',tanggal:ymd(new Date()),shift_kode:'SHIFT_1',waktu_masuk:'06:58',waktu_pulang:'15:02',durasi_menit:484,menit_terlambat:0,status_kehadiran:'Tepat Waktu',status_lokasi:'Terminal Admin'}],
izin:[{id:'pi1',karyawan_id:'p2',nama_karyawan:'Rizky Pratama',jenis_izin:'Sakit',tanggal_mulai:ymd(new Date()),tanggal_selesai:ymd(new Date()),jumlah_hari:1,alasan:'Demam',info_lampiran:'-',status_approval:'Menunggu'}],pengaturan_shift:[]};

// ===== LAPISAN DATABASE (Supabase asli / memori saat preview) =====
const D={
async list(t,c,v){if(P)return M[t].filter(r=>!c||r[c]===v).map(r=>({...r}));return D.all(()=>{let x=db.from(t).select('*');if(c)x=x.eq(c,v);return x})},
async all(mk){let o=[],f=0;for(;;){const r=await mk().order('id').range(f,f+999);if(r.error)throw r.error;o=o.concat(r.data);if(r.data.length<1000)return o;f+=1000}},
async sel(t,cols,a,b){if(P)return M[t].filter(r=>r.tanggal>=a&&r.tanggal<=b);return D.all(()=>db.from(t).select(cols).gte('tanggal',a).lte('tanggal',b))},
async ins(t,row){if(P){row={id:'p'+Math.random().toString(36).slice(2),...row};M[t].push(row);return row}const r=await db.from(t).insert(row).select().single();if(r.error)throw r.error;return r.data},
async upd(t,id,p){if(P){Object.assign(M[t].find(x=>x.id===id),p);return}const r=await db.from(t).update(p).eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error('Ditolak oleh RLS / data tidak ditemukan')},
async del(t,id){if(P){M[t]=M[t].filter(x=>x.id!==id);return}const r=await db.from(t).delete().eq('id',id).select();if(r.error)throw r.error;if(!r.data.length)throw new Error('Ditolak oleh RLS / data tidak ditemukan')},
async saveCfg(c){if(P)return;const r=await db.from('pengaturan_shift').upsert({id:1,...c});if(r.error)throw r.error},
async purge(cut){for(const[t,c]of[['absensi','tanggal'],['izin','tanggal_mulai']]){if(P){M[t]=cut?M[t].filter(r=>r[c]>=cut):[];continue}let x=db.from(t).delete();x=cut?x.lt(c,cut):x.not('id','is',null);const r=await x;if(r.error)throw r.error}}
};

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',3400)}
const err=e=>{console.error(e);toast('⚠️ '+(e.message||e))};
const emp=id=>S.emps.find(e=>e.id===id);
const isA=()=>S.role==='ADMIN';
const shLbl=c=>c==='SHIFT_1'?`Shift 1 (${S.cfg.shift1_in}-${S.cfg.shift1_out})`:c==='SHIFT_2'?`Shift 2 (${S.cfg.shift2_in}-${S.cfg.shift2_out})`:c==='IZIN'?'Izin/Sakit':'Libur';
const todayIdx=()=>(new Date().getDay()+6)%7;
const stPill=s=>`<span class="pill ${s==='Tepat Waktu'?'g1':s==='Terlambat'?'y':'r'}">${esc(s)}</span>`;

async function loadData(){
 const st=S.role==='STAFF',[e,l,v,c]=await Promise.all([st?D.list('karyawan','id',S.me):D.list('karyawan'),st?D.list('absensi','karyawan_id',S.me):D.list('absensi'),st?D.list('izin','karyawan_id',S.me):D.list('izin'),D.list('pengaturan_shift')]);
 S.emps=e.sort((a,b)=>(a.nik||'').localeCompare(b.nik||''));
 S.logs=l.sort((a,b)=>(b.tanggal+(b.waktu_masuk||'')).localeCompare(a.tanggal+(a.waktu_masuk||'')));
 S.leaves=v.sort((a,b)=>(b.tanggal_mulai||'').localeCompare(a.tanggal_mulai||''));
 S.cfg={...DEF,...(c[0]||{})};
}
async function refresh(){try{await loadData();render()}catch(e){err(e)}}

// ===== TAMPILAN =====
const NAV=[['dash','📊','Dasbor',0],['scan','📷','Absen',0],['emps','👥','Karyawan',1],['sched','🗓️','Jadwal',0],['leave','🏥','Izin/Sakit',0],['rep','📈','Rekap',0],['star','🏆','Teladan',0]];
const TTL={dash:'Dasbor',scan:'Absensi Wajah & Lokasi',emps:'Data Karyawan',sched:'Jadwal 2 Shift',leave:'Pengajuan Izin / Sakit',rep:'Rekap Jam Kerja',star:'Karyawan Teladan'};
const mapA=l=>l.lat!=null&&l.lng!=null?` <a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener" style="color:#4338ca;font-weight:800">🗺️ Peta</a>`:'';

function notifData(){const t=ymd(new Date()),nowM=mins(hm(new Date())),C=S.cfg;
 const late=S.logs.filter(l=>l.tanggal===t&&l.shift_kode!=='IZIN'&&l.menit_terlambat>0),absent=[];
 S.emps.forEach(e=>{const sh=e.jadwal_minggu?.[todayIdx()];if(sh!=='SHIFT_1'&&sh!=='SHIFT_2')return;const st=mins(sh==='SHIFT_1'?C.shift1_in:C.shift2_in);if(nowM-st<=C.toleransi_menit)return;
  if(S.logs.some(l=>l.karyawan_id===e.id&&l.tanggal===t))return;if(S.leaves.some(v=>v.karyawan_id===e.id&&v.status_approval==='Disetujui'&&v.tanggal_mulai<=t&&t<=v.tanggal_selesai))return;
  absent.push({e,sh,over:nowM-st,end:nowM>mins(sh==='SHIFT_1'?C.shift1_out:C.shift2_out)})});
 const pend=S.leaves.filter(v=>v.status_approval==='Menunggu');return{late,absent,pend,n:late.length+absent.length+pend.length}}
function notif(){const d=notifData(),tag=(ic,t,n)=>`<div style="font-weight:800;margin-top:14px">${ic} ${t} <span class="pill ${n?'r':'g1'}">${n}</span></div>`;
 let h=`<div class="g p" style="${d.n?'border-color:#fda4af;':''}"><h3>🔔 Notifikasi ${d.n?`<span class="pill r">${d.n}</span>`:''}</h3>`;
 if(isA()){
  h+=tag('⏰','Karyawan Terlambat Hari Ini',d.late.length)+(d.late.map(l=>`<div class="row"><div style="display:flex;gap:10px;align-items:center">${thumb(l.foto_masuk)}<div><b>${esc(l.nama_karyawan)}</b><div class="mut">Masuk ${esc(l.waktu_masuk)} • ${shLbl(l.shift_kode)}</div></div></div><span class="pill y">⏰ Telat ${l.menit_terlambat} mnt</span></div>`).join('')||empty('Tidak ada yang terlambat 👍'));
  h+=tag('❗','Belum Absen (Lewat Jam Masuk)',d.absent.length)+(d.absent.map(x=>`<div class="row"><div><b>${esc(x.e.nama)}</b><div class="mut">${shLbl(x.sh)} • ${x.end?'shift sudah selesai':'belum absen'}</div></div><span class="pill r">❗ ${x.over} mnt lewat jam masuk</span></div>`).join('')||empty('Semua karyawan terjadwal sudah absen ✅'));
  h+=tag('📋','Pengajuan Izin/Sakit Menunggu',d.pend.length)+(d.pend.map(v=>`<div class="row"><div><b>${esc(v.nama_karyawan)}</b> <span class="pill">${esc(v.jenis_izin)}</span><div class="mut">${esc(v.tanggal_mulai)} s.d. ${esc(v.tanggal_selesai)} (${v.jumlah_hari} hr) • ${esc(v.alasan)}</div></div><div><button class="btn ok sm" onclick="A.appr('${v.id}',1)">✓ Setujui</button> <button class="btn no sm" onclick="A.appr('${v.id}',0)">✕ Tolak</button></div></div>`).join('')||empty('Tidak ada pengajuan baru'))}
 else{const x=d.absent[0],mine=d.late[0];
  if(x)h+=`<div class="row" style="background:#ffe4e6"><div><b>❗ Anda belum absen hari ini!</b><div class="mut">${shLbl(x.sh)} • sudah lewat ${x.over} menit dari jam masuk</div></div><button class="btn no sm" onclick="A.go('scan')">📷 Absen Sekarang</button></div>`;
  if(mine)h+=`<div class="row" style="background:#fef3c7"><b>⏰ Hari ini Anda terlambat ${mine.menit_terlambat} menit</b></div>`;
  h+=tag('📋','Status Pengajuan Saya',S.leaves.length)+(S.leaves.slice(0,3).map(v=>`<div class="row"><div><span class="pill">${esc(v.jenis_izin)}</span> <span class="mut">${esc(v.tanggal_mulai)} s.d. ${esc(v.tanggal_selesai)}</span></div><span class="pill ${v.status_approval==='Disetujui'?'g1':v.status_approval==='Ditolak'?'r':'y'}">${esc(v.status_approval)}</span></div>`).join('')||empty('Belum ada pengajuan'))+`<div style="margin-top:10px"><button class="btn sm" onclick="A.go('leave')">+ Ajukan Izin / Sakit</button></div>`}
 return h+'</div>'}
function starData(){const m={};(isA()?S.logs:S.tl).filter(l=>l.shift_kode!=='IZIN'&&String(l.tanggal).startsWith(S.tm)).forEach(l=>{const o=m[l.karyawan_id]||(m[l.karyawan_id]={id:l.karyawan_id,nama:l.nama_karyawan,h:0,on:0,lt:0,lm:0,mn:0});o.h++;if((l.menit_terlambat||0)>0){o.lt++;o.lm+=l.menit_terlambat}else o.on++;o.mn+=l.durasi_menit||0});
 return Object.values(m).map(o=>{o.bonus=o.lt===0&&o.h>=5?20:0;o.sk=o.on*10+o.lt*5-Math.floor(o.lm/10)+o.bonus;const r=o.on/o.h;o.st=r>=.95?5:r>=.85?4:r>=.7?3:r>=.5?2:1;return o}).sort((a,b)=>b.sk-a.sk||a.lm-b.lm||b.mn-a.mn)}
function starBody(){const R=starData();if(!R.length)return `<div class="g p">${empty('Belum ada data absensi pada bulan ini.')}</div>`;
 const stars=n=>'⭐'.repeat(n)+'<span style="opacity:.25">'+'⭐'.repeat(5-n)+'</span>',bln=new Date(S.tm+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'}),top=R.slice().sort((a,b)=>b.mn-a.mn)[0];
 const pod=(o,k)=>{if(!o)return'<div></div>';const b=k===1;return `<div class="g" style="padding:${b?'26px 10px':'16px 8px'};text-align:center;${b?'background:linear-gradient(160deg,#fde68a,#fff7d6);border-color:#f59e0b;transform:translateY(-8px);':''}"><div style="font-size:${b?56:36}px;line-height:1.1">${k===1?'🏆':k===2?'🥈':'🥉'}</div><div style="font-weight:800;font-size:${b?15:12}px;margin-top:6px;word-break:break-word">${esc(o.nama)}</div><div style="font-size:${b?14:11}px;margin:4px 0">${stars(o.st)}</div><span class="pill ${b?'y':''}">Skor ${o.sk}</span>${o.bonus?'<div style="margin-top:6px;font-size:18px">🎁</div>':''}</div>`};
 const c2=(i,l,v)=>`<div class="g card"><span>${i}</span><div><small>${l}</small><b style="font-size:15px">${v}</b></div></div>`;
 return `<div class="g p" style="text-align:center">🎉 Selamat kepada <b>${esc(R[0].nama)}</b>, Karyawan Teladan ${bln}! 🏆🎁⭐</div>
 <div style="display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:end;margin:18px 0 16px">${pod(R[1],2)+pod(R[0],1)+pod(R[2],3)}</div>
 <div class="cards">${c2('🏆','Karyawan Teladan',esc(R[0].nama))+c2('🎁','Tanpa Terlambat',R.filter(o=>o.bonus).length+' orang')+c2('💪','Jam Kerja Terbanyak',esc(top.nama)+' • '+dur(top.mn))}</div>
 <div class="g p"><h3>Peringkat ${bln}</h3>${R.map((o,i)=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><b style="width:28px;text-align:center;font-size:17px">${i<3?['🥇','🥈','🥉'][i]:i+1}</b><div><b>${esc(o.nama)}</b>${o.id===S.me?' <span class="pill">Anda</span>':''}<div class="mut">Hadir ${o.h} hr • Tepat ${o.on} • Telat ${o.lt} (${o.lm} mnt) • ${dur(o.mn)}</div></div></div><div style="text-align:right"><div style="font-size:12px">${stars(o.st)}</div><b>${o.sk} poin</b>${o.bonus?' 🎁':''}${i===0?' 🏆':''}</div></div>`).join('')}</div>`}

const V={
dash(){const t=ymd(new Date()),ym=t.slice(0,7),card=(i,l,v)=>`<div class="g card"><span>${i}</span><div><small>${l}</small><b>${v}</b></div></div>`;
 if(isA()){const L=S.logs.filter(l=>l.tanggal===t&&l.shift_kode!=='IZIN'),n1=S.emps.filter(e=>e.shift_default==='SHIFT_1').length;
  return notif()+`<div class="cards">${card('👥','Total Karyawan',S.emps.length)+card('✅','Hadir Hari Ini',L.length)+card('⏰','Terlambat Hari Ini',L.filter(l=>l.menit_terlambat>0).length)+card('🏥','Izin Menunggu',S.leaves.filter(v=>v.status_approval==='Menunggu').length)}</div>
  <div class="g p"><h3>Komposisi Shift</h3><div class="row"><span>${shLbl('SHIFT_1')}</span><b>${n1} staf</b></div><div class="row"><span>${shLbl('SHIFT_2')}</span><b>${S.emps.length-n1} staf</b></div></div>
  <div class="g p"><h3>Absensi Hari Ini</h3>${L.map(logRow).join('')||empty('Belum ada absensi hari ini.')}</div>`}
 const me=emp(S.me),M2=S.logs.filter(l=>l.tanggal.startsWith(ym)&&l.shift_kode!=='IZIN');
 return notif()+`<div class="cards">${card('👤','Karyawan',esc(me?.nama||'-'))+card('🗓️','Shift Hari Ini',me?shLbl(me.jadwal_minggu?.[todayIdx()]||'LIBUR'):'-')+card('✅','Hadir Bulan Ini',M2.length+' hari')+card('⏱️','Total Jam Bulan Ini',dur(M2.reduce((a,l)=>a+(l.durasi_menit||0),0)))}</div>

 logs=`<div class="g p"><h3>Log Hari Ini</h3>${L.map(logRow).join('')||empty('Belum ada log.')}</div>`;
 if(isA()){const o=S.emps.map(e=>`<option value="${e.id}">${e.face_descriptor?'🙂':'⚠️'} ${esc(e.nama)} (${esc(e.nik)})</option>`).join('');
  return `<div class="g p"><h3>Terminal Absensi (Admin)</h3><p class="mut">Check-in/out manual oleh admin & pendaftaran wajah. ⚠️ = wajah belum terdaftar. Karyawan absen mandiri lewat HP masing-masing (wajah + lokasi).</p>
 <div class="two"><div><label>Karyawan</label><select class="in" id="sc-emp" onchange="A.scDef()">${o}</select></div><div><label>Shift</label><select class="in" id="sc-shift"><option value="SHIFT_1">${shLbl('SHIFT_1')}</option><option value="SHIFT_2">${shLbl('SHIFT_2')}</option></select></div></div>${cam}
 <div class="f" style="margin-top:8px;justify-content:center"><button class="btn ok" style="flex:0" onclick="A.scan('IN')">📥 Check-In</button><button class="btn" style="flex:0" onclick="A.scan('OUT')">📤 Check-Out</button><button class="btn w" style="flex:0" onclick="A.enrollSel()">🙂 Daftar / Ulang Wajah</button></div></div>`+logs}
 const me=emp(S.me),sh=me?.jadwal_minggu?.[todayIdx()]||'LIBUR',lok=S.cfg.office_lat!=null,T=L.filter(l=>l.shift_kode!=='IZIN'),op=T.find(l=>l.waktu_pulang==='-'),dn=!op&&T.length>0,ready=me?.face_descriptor||P;
 const stat=op?`🟢 Masuk ${esc(op.waktu_masuk)} • belum pulang`:dn?`✅ Masuk ${esc(T[0].waktu_masuk)} • Pulang ${esc(T[0].waktu_pulang)}`:'⚪ Belum absen hari ini';
 const big=(c,t,f)=>`<button class="btn ${c}" style="width:100%;padding:24px 10px;font-size:22px;border-radius:22px;margin-top:10px" onclick="${f}">${t}</button>`;
 return `<div class="g p" style="text-align:center"><h3 style="font-size:17px">Halo, ${esc(me?.nama||'')} 👋</h3><p class="mut">Jadwal hari ini: <b>${shLbl(sh)}</b></p><div style="font-size:16px;font-weight:800;margin:6px 0">${stat}</div>${cam}
 <div id="gst" class="mut">📍 Lokasi akan dicek otomatis</div>

 <p class="mut">${lok?'':'⚠️ Admin belum mengatur lokasi kantor • '}Cukup 1 ketukan: lokasi & wajah dicek otomatis</p></div>`+logs},

 return `<div class="g p"><h3>Form Pengajuan</h3><form onsubmit="A.sendLeave(event)"><label>Karyawan</label><select class="in" id="lv-e">${o}</select>

const FACE_T=0.5,MURL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';let FA={ready:false,stream:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function camOff(){if(FA.stream){FA.stream.getTracks().forEach(t=>t.stop());FA.stream=null}const v=$('cam');if(v)v.srcObject=null;const f=$('fbox');if(f)f.style.display='none'}
async function faceLoad(){if(FA.ready)return;if(!window.faceapi)throw new Error('Library wajah gagal dimuat, cek koneksi internet');await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MURL),faceapi.nets.faceLandmark68Net.loadFromUri(MURL),faceapi.nets.faceRecognitionNet.loadFromUri(MURL)]);FA.ready=true}
async function camOn(){if(!navigator.mediaDevices)throw new Error('Kamera butuh koneksi HTTPS');if(!FA.stream)FA.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false}).catch(()=>{throw new Error('Izin kamera ditolak. Aktifkan kamera untuk situs ini.')});const v=$('cam');v.srcObject=FA.stream;await v.play();let k=0;while((v.readyState<2||!v.videoWidth)&&k++<60)await sleep(100);guide(false,'Arahkan wajah ke dalam kotak')}
function guide(ok,m){const f=$('fbox'),c=ok?'#22c55e':'#f43f5e';if(f){f.style.display='block';f.style.borderColor=c;f.style.boxShadow='0 0 0 9999px rgba(0,0,0,.38),0 0 22px '+c+',inset 0 0 22px '+(ok?'rgba(34,197,94,.5)':'rgba(244,63,94,.4)')}camSt((ok?'🟢 ':'🔴 ')+m)}
async function faceGrab(maxMs=25000){const v=$('cam');if(!v)return null;const o=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.4});let okN=0,miss=0;const t0=Date.now();
 while(Date.now()-t0<maxMs){if(!$('cam')||!FA.stream)return null;
  const d=await faceapi.detectSingleFace(v,o);
  if(!d){okN=0;miss++;guide(false,miss>8?'Wajah belum terlihat • cari tempat lebih terang':'Arahkan wajah ke dalam kotak');await sleep(120);continue}
  miss=0;const b=d.box,vw=v.videoWidth,vh=v.videoHeight,n=Math.min(vw,vh),dx=1-((b.x+b.width/2)-(vw-n)/2)/n,dy=((b.y+b.height/2)-(vh-n)/2)/n,sz=b.width/n;
  const m=sz<.32?'Dekatkan wajah':sz>.62?'Mundur sedikit':dx<.37?'Geser wajah ke kanan':dx>.63?'Geser wajah ke kiri':dy<.35?'Turunkan wajah sedikit':dy>.65?'Naikkan wajah sedikit':null;
  if(m){okN=0;guide(false,m);await sleep(120);continue}
  okN++;guide(true,'Pas! Tahan sebentar...');
  if(okN>=3){const r=await faceapi.detectSingleFace(v,o).withFaceLandmarks().withFaceDescriptor();if(r)return Array.from(r.descriptor);okN=0}
  await sleep(120)}
 guide(false,'Waktu habis, ketuk tombol lagi');return null}
const fdist=(a,b)=>Math.sqrt(a.reduce((q,x,i)=>q+(x-b[i])**2,0));
const geo=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Browser tidak mendukung GPS'));navigator.geolocation.getCurrentPosition(p=>ok(p.coords),e=>no(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan lokasi untuk situs ini.':'Gagal membaca lokasi, coba di area terbuka')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))};

function beep(q){try{unlockAudio();let t=AC.currentTime;q.forEach(([f,d,y])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=y||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.6,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d})}catch(_){}}

 beep(SND[k]);setTimeout(()=>say(voice),k==='err'?500:700);try{navigator.vibrate&&navigator.vibrate(k==='err'?[200,100,200]:[150])}catch(_){}clearTimeout(ovl.k);ovl.k=setTimeout(()=>o.style.display='none',8000)}

 <div class="g p tw"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Shift</th><th>Masuk - Pulang</th><th>Durasi</th><th>Status</th><th>Jarak</th><th>Lokasi</th><th>Foto</th></tr></thead><tbody>${R.map(l=>`<tr><td>${esc(l.tanggal)}</td><td><b>${esc(l.nama_karyawan)}</b></td><td>${esc(l.shift_kode)}</td><td>${esc(l.waktu_masuk)} - ${esc(l.waktu_pulang)}</td><td>${dur(l.durasi_menit||0)}</td><td>${stPill(l.status_kehadiran)}</td><td>${l.jarak_meter!=null?'<b>📍 '+l.jarak_meter+' m</b>':'-'}</td><td>${esc(l.status_lokasi||'-')}${l.skor_wajah!=null?'<div class="mut">🙂 wajah '+l.skor_wajah+'%</div>':''}${mapA(l)}</td><td><div style="display:flex;gap:6px">${thumb(l.foto_masuk)||'-'}${thumb(l.foto_pulang)}</div></td></tr>`).join('')||`<tr><td colspan="9">${empty('Tidak ada data pada rentang ini.')}</td></tr>`}</tbody></table></div>`},
async star(){if(!isA()){try{const[y,m]=S.tm.split('-').map(Number),last=new Date(y,m,0).getDate();S.tl=await D.sel('absensi','karyawan_id,nama_karyawan,tanggal,shift_kode,menit_terlambat,durasi_menit',S.tm+'-01',S.tm+'-'+pad(last))}catch(e){err(e)}}const b=$('sb');if(b)b.innerHTML=starBody()},
tmSet(){if($('tm').value){S.tm=$('tm').value;A.star()}},
csv(){csvDown(repRows(),'Rekap_Absensi')},
cfgForm(){const c=S.cfg,t=(i,l,v)=>`<div><label>${l}</label><input class="in" type="time" id="${i}" value="${v}"></div>`,n=(i,l,v)=>`<div><label>${l}</label><input class="in" type="number" step="0.5" id="${i}" value="${v}"></div>`;
 modal(`<h3>⏰ Jam Kerja 2 Shift</h3><form onsubmit="A.saveCfg(event)"><div class="two">${t('c1i','Shift 1 Masuk',c.shift1_in)+t('c1o','Shift 1 Pulang',c.shift1_out)+t('c2i','Shift 2 Masuk',c.shift2_in)+t('c2o','Shift 2 Pulang',c.shift2_out)}</div>
 <div class="two">${n('ct','Toleransi (mnt)',c.toleransi_menit)+n('cj','Target Jam/Hari',c.target_jam)}</div>
 <h4 style="margin:14px 0 0">📍 Lokasi Kantor</h4><div class="two"><div><label>Latitude</label><input class="in" id="cla" type="number" step="any" value="${c.office_lat??''}"></div><div><label>Longitude</label><input class="in" id="clo" type="number" step="any" value="${c.office_lng??''}"></div></div>
 <div class="two"><div><label>Radius (meter)</label><input class="in" id="cr" type="number" value="${c.radius_gps||100}"></div><div style="display:flex;align-items:flex-end"><button type="button" class="btn w" style="width:100%" onclick="A.useMyLoc()">📍 Pakai Lokasi Saya</button></div></div><div class="f" style="margin-top:14px"><button class="btn ok" style="flex:1">✓ Simpan</button><button type="button" class="btn w" onclick="A.close()">Batal</button></div></form>`)},
async saveCfg(ev){ev.preventDefault();const c={shift1_in:$('c1i').value,shift1_out:$('c1o').value,shift2_in:$('c2i').value,shift2_out:$('c2o').value,toleransi_menit:+$('ct').value||0,target_jam:+$('cj').value||8,radius_gps:+$('cr').value||100,office_lat:$('cla').value===''?null:+$('cla').value,office_lng:$('clo').value===''?null:+$('clo').value};
 try{await D.saveCfg(c);S.cfg=c;close();render();toast('Jam shift tersimpan')}catch(e){err(e)}},
purgeForm(){modal(`<h3>🧹 Kosongkan Transaksi</h3><p class="mut">Hanya menghapus log absensi & izin. Data karyawan tetap aman.</p>
 <label>Mode</label><select class="in" id="pm"><option value="3">Lebih lama dari 3 bulan</option><option value="6">Lebih lama dari 6 bulan</option><option value="0">Semua log absensi & izin</option></select>
 <label><input type="checkbox" id="pb" checked> Unduh backup CSV dulu</label><label>Ketik <b>HAPUS</b> untuk konfirmasi</label><input class="in" id="pc">
 <div class="f" style="margin-top:14px"><button class="btn no" style="flex:1" onclick="A.purge()">🗑️ Backup & Kosongkan</button><button class="btn w" onclick="A.close()">Batal</button></div>`)},
async purge(){if($('pc').value.trim().toUpperCase()!=='HAPUS')return toast('Ketik HAPUS untuk konfirmasi');const m=+$('pm').value;let cut=null;if(m){const d=new Date();d.setMonth(d.getMonth()-m);cut=ymd(d)}
 try{if($('pb').checked)csvDown(cut?S.logs.filter(l=>l.tanggal<cut):S.logs,'Backup_Absensi');await D.purge(cut);await rmFoto(cut?S.logs.filter(l=>l.tanggal<cut):S.logs);close();toast('Transaksi dikosongkan');await refresh()}catch(e){err(e)}},
close
};

setInterval(()=>{if(S.role&&!document.hidden&&S.view==='dash'&&$('md').style.display!=='flex'&&$('ovl').style.display!=='flex')refresh()},60000);

(async()=>{try{
 if(!P){if(!db)throw new Error('Supabase gagal dimuat');const r=await db.auth.getSession();if(r.data.session)S.role='ADMIN'}
 if(!S.role){let id=null;try{id=localStorage.getItem('sc_me')}catch(_){}if(id&&!P){const r=await D.list('karyawan','id',id);if(r[0]){S.role='STAFF';S.me=id}}}
 if(S.role)await loadData()}catch(e){err(e)}render()})();
})();
